framework:
    secret: test
    test: true
    http_method_override: false
    php_errors:
        log: true
    router:
        resource: '%kernel.project_dir%/config/routing.yml'
        utf8: true
    session:
        handler_id: ~
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.mock_file

security:
    providers:
        in_memory:
            memory: ~
    firewalls:
        main:
            lazy: true
