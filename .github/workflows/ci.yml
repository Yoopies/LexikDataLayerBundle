name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            symfony: '5.4.*'
          - php: '8.1'
            symfony: '5.4.*'
          - php: '8.1'
            symfony: '6.4.*'
          - php: '8.3'
            symfony: '6.4.*'

    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Symfony version
        run: |
          composer require --no-update "symfony/framework-bundle:${{ matrix.symfony }}" "symfony/security-bundle:${{ matrix.symfony }}" "symfony/twig-bundle:${{ matrix.symfony }}"
          composer require --dev --no-update "symfony/phpunit-bridge:${{ matrix.symfony }}" "symfony/yaml:${{ matrix.symfony }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: composer test
